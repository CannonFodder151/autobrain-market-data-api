name: Build market-data-api image (multi-arch)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: true
        default: hosted
      platforms:
        description: Comma-separated platforms
        required: true
        default: linux/amd64,linux/arm64

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: ${{ github.event.inputs.platforms != 'linux/amd64' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          TAG: ${{ github.event.inputs.tag || 'hosted' }}
          PLATFORMS: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
        run: |
          set -euo pipefail
          docker buildx build --platform "${PLATFORMS}" --push \
            -t "ghcr.io/cannonfodder151/market-data-api:${TAG}" \
            -t "ghcr.io/cannonfodder151/market-data-api:latest" .
